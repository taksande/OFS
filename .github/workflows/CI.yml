
name: OFS Angular Plugin CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Plugin Changes
    runs-on: ubuntu-latest

    outputs:
      plugin_changed: ${{ steps.filter.outputs.plugin }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Delta Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.repository.default_branch }}
          filters: |
            plugin:
              - 'transmission_emergency_plugin-1.1.264-sources/**'

  build-and-package:
    name: Build and Package OFS Plugin
    needs: detect-changes

    if: >-
      needs.detect-changes.outputs.plugin_changed == 'true' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: transmission_emergency_plugin-1.1.264-sources/package-lock.json

      - name: Install Dependencies
        working-directory: transmission_emergency_plugin-1.1.264-sources
        run: npm ci

      - name: Build Angular Plugin
        working-directory: transmission_emergency_plugin-1.1.264-sources
        run: npx grunt build

      - name: Verify Hosted Output
        run: |
          test -d transmission_emergency_plugin-1.1.264-hosted

      - name: Create Hosted ZIP
        uses: vimtor/action-zip@v1.3
        with:
          files: transmission_emergency_plugin-1.1.264-hosted/
          dest: transmission_emergency_plugin-1.1.264-hosted.zip
          recursive: true

      - name: Upload CI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: transmission_emergency_plugin-1.1.264-hosted
          path: transmission_emergency_plugin-1.1.264-hosted.zip
          if-no-files-found: error
          retention-days: 14
