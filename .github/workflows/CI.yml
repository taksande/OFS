
name: OFS Angular Plugin CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Plugin Changes
    runs-on: windows-latest

    outputs:
      plugin_changed: ${{ steps.filter.outputs.plugin }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Delta Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            plugin:
              - 'transmission_emergency_plugin-1.1.264-sources/**'

  build-and-package:
    name: Build OFS Angular Plugin
    needs: detect-changes
    runs-on: windows-latest

    if: >-
      needs.detect-changes.outputs.plugin_changed == 'true' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: transmission_emergency_plugin-1.1.264-sources/package-lock.json

      - name: Install Dependencies
        working-directory: transmission_emergency_plugin-1.1.264-sources
        run: npm ci

      - name: Execute Grunt Build
        working-directory: transmission_emergency_plugin-1.1.264-sources
        run: npx grunt build

      - name: Upload Hosted ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: transmission_emergency_plugin-1.1.264-hosted
          path: transmission_emergency_plugin-1.1.264-sources/transmission_emergency_plugin-1.1.264-hosted.zip
          if-no-files-found: error
          retention-days: 14
